name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # example/'s file:.. dependency on this package is hardlinked at
      # install time - on the first install (above), dist/ doesn't exist
      # yet, so the link has nothing to point at. Re-running install now
      # that build has produced dist/ re-links it so example/src (which the
      # root tsconfig includes) actually resolves the package during
      # typecheck below.
      - name: Re-link workspace after build
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  webrtc-smoke:
    runs-on: ubuntu-latest
    # Fake-media-device WebRTC tests can be flaky in hosted CI runners;
    # keep this non-blocking until it's proven stable, then drop
    # continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: WebRTC smoke test
        run: bun run test:webrtc
